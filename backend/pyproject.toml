[project]
name = "finance-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jakub Wilk", email = "jakub.wilk@jakubwilk.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-httplib2>=0.4.0",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.3.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
