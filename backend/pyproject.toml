readme = "README.md"
authors = [
    { name = "Jakub Wilk", email = "jakub.wilk@jakubwilk.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
