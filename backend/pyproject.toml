[project]
name = "finance-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jakub Wilk", email = "jakub.wilk@jakubwilk.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.13",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-httplib2>=0.4.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langsmith>=0.3.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's `Depends(...)` in argument defaults is the intended,
# documented DI pattern, not the "mutable default"-style bug this rule
# normally flags.
"src/finance_agent/api/routes.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
